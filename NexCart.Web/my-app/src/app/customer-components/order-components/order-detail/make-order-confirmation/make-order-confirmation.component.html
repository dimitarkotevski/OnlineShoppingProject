<h2 mat-dialog-title class="pay-title">
  <i class="fa-solid fa-credit-card me-2"></i>
  Pay for your order
</h2>

<mat-dialog-content>
  <div class="pay-summary">
    <div class="pay-summary__row">
      <span>Order</span>
      <strong>{{ orderViewModel.OrderName || "—" }}</strong>
    </div>
    <div class="pay-summary__row">
      <span>Status</span>
      <span class="pay-summary__status">{{ orderViewModel.OrderStatus | orderStatus }}</span>
    </div>
    <div class="pay-summary__row pay-summary__row--total">
      <span>Total</span>
      <strong>{{ (orderViewModel.TotalAmount || 0) | currency }}</strong>
    </div>
  </div>

  <span class="pay-label">Payment method</span>
  <div class="pay-methods" role="radiogroup" aria-label="Payment method">
    <button
      type="button"
      class="pay-method"
      role="radio"
      [attr.aria-checked]="orderViewModel.PaymentType === 0"
      [class.pay-method--selected]="orderViewModel.PaymentType === 0"
      (click)="orderViewModel.PaymentType = 0"
    >
      <i class="fa-solid fa-money-bill-wave"></i>
      <span class="pay-method__name">Cash</span>
      <span class="pay-method__hint">Pay on delivery</span>
    </button>
    <button
      type="button"
      class="pay-method"
      role="radio"
      [attr.aria-checked]="orderViewModel.PaymentType === 1"
      [class.pay-method--selected]="orderViewModel.PaymentType === 1"
      (click)="orderViewModel.PaymentType = 1"
    >
      <i class="fa-solid fa-credit-card"></i>
      <span class="pay-method__name">Card</span>
      <span class="pay-method__hint">Pay with your saved card</span>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null" class="pay-cancel">Cancel</button>
  <button
    mat-flat-button
    class="pay-submit"
    [disabled]="orderViewModel.PaymentType == null"
    [mat-dialog-close]="orderViewModel"
  >
    <i class="fa-solid fa-lock me-1"></i>
    Pay {{ (orderViewModel.TotalAmount || 0) | currency }}
  </button>
</mat-dialog-actions>
