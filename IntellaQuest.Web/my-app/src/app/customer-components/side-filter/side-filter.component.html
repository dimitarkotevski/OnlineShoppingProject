<div>
  <div id="accordion">
    <div class="card">
      <div class="card-header p-0">
        <h5 class="mb-0">
          <div
            class="btn solid-color-a left-solid-text w-100"
            aria-expanded="true"
          >
            Price
          </div>
        </h5>
      </div>

      <div>
        <div class="card-body">
          <div class="row">
            <div class="col-5">
              <div class="input-group">
                <span class="py-2">$</span
                ><input
                [(ngModel)]="filterProducts.PriceFrom"
                  type="text"
                  name="price"
                  class="form-control"
                  placeholder="From"
                />
              </div>
            </div>

            <div class="col-1">
              <div class="input-group">
                <span class="py-2">-</span>
              </div>
            </div>

            <div class="col-5">
              <div class="input-group">
                <span class="py-2">$</span
                ><input
                [(ngModel)]="filterProducts.PriceTo"
                  type="text"
                  name="price"
                  class="form-control"
                  placeholder="To"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 py-3">
          <button class="btn solid_button solid_button w-75" (click)="searchPrice()" >Search</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header p-0">
        <h5 class="mb-0">
          <div class="btn solid-color-a left-solid-text w-100">
            Brands
            <i class="fa-solid fa-list-radio"></i>
          </div>
        </h5>
      </div>
      <div>
        <div class="card-body">
          <ul class="form-check">
            <li *ngFor="let brand of brands">
              <input
                (change)="onChangeBrands($event)"
                class="form-check-input"
                id="{{ brand }}"
                name="{{ brand }}"
                type="checkbox"
                value="{{ brand }}"
              />
              <label for="{{ brand }}">{{ brand }}</label>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</div>
