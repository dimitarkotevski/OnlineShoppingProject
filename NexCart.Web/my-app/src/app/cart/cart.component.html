<div class="container">
  <app-breadcrumb 
      [isItem]="false" 
      [itemDetail]="'Cart'">
  </app-breadcrumb>

  <div *ngIf="shoppingCart">
    <app-products-grid [type]="'cart'" [shoppingCart]="shoppingCart" (refreshState)="refreshState()">
    </app-products-grid>
    <div *ngIf="shoppingCart.ShoppingCartDetails.length > 0" class="cart-actions">
      <button
        type="button"
        class="btn solid-button-order"
        (click)="MakeOrder(shoppingCart.Id)"
      >
        <i class="fa-solid fa-bag-shopping me-2" aria-hidden="true"></i>
        Order here
      </button>
    </div>
  </div>
  <app-loading-grid *ngIf="isLoading" [isGridLoading]="false"></app-loading-grid>

</div>
<div *ngIf="!isLoading && (error || !shoppingCart || (shoppingCart && shoppingCart.ShoppingCartDetails && shoppingCart.ShoppingCartDetails.length == 0))" class="container">
  <app-no-data
    title="List of cart products is empty!"
    message="Looks like you haven't added any products to your cart yet."
    icon="fa-solid fa-bag-shopping"
    buttonText="Keep buying"
    buttonRoute="/"
  ></app-no-data>
</div>
