<div class="carousel-container">
  <ngb-carousel 
    *ngIf="slides && slides.length"
    [interval]="4000" 
    [pauseOnHover]="true" 
    [pauseOnFocus]="true"
    [wrap]="true"
    [keyboard]="true"
    [showNavigationArrows]="true"
    [showNavigationIndicators]="true">
    <ng-template ngbSlide *ngFor="let slide of slides" [id]="slide.id">
      <div class="carousel-slide-wrapper">
        <img 
          [src]="slide.image" 
          [alt]="slide.alt" 
          (error)="onImageError($event, slide.fallbackUrl)"
          class="d-block w-100 carousel-slide-image" />
        <div class="carousel-gradient-overlay"></div>
      </div>
      <div class="carousel-caption-custom d-none d-md-block">
        <h3>{{ slide.title }}</h3>
        <p>{{ slide.description }}</p>
      </div>
    </ng-template>
  </ngb-carousel>
</div>
