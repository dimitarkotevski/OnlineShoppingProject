<div class="container settings-page">
    <app-breadcrumb [isItem]="false" [itemDetail]="'Settings'"></app-breadcrumb>

    <div class="row g-4">
        <!-- Section navigation -->
        <div class="col-md-4 col-lg-3">
            <nav class="settings-nav">
                <button type="button" class="settings-nav__item"
                    [class.settings-nav__item--active]="activeTab === 'account'" (click)="switchTab('account')">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span>Profile information</span>
                </button>
                <button type="button" class="settings-nav__item"
                    [class.settings-nav__item--active]="activeTab === 'address'" (click)="switchTab('address')">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                    <span>Address information</span>
                </button>
                <button type="button" class="settings-nav__item"
                    [class.settings-nav__item--active]="activeTab === 'password'" (click)="switchTab('password')">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <span>Change password</span>
                </button>
            </nav>
        </div>

        <!-- Panels -->
        <div class="col-md-8 col-lg-9">
            <!-- Profile information -->
            <section class="settings-card" *ngIf="activeTab === 'account'">
                <div class="settings-card__header">
                    <h3>Profile information</h3>
                    <p>Update the public details shown on your account.</p>
                </div>

                <div class="settings-card__body" *ngIf="userDetails">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" [(ngModel)]="userDetails.FirstName"
                                placeholder="First name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" [(ngModel)]="userDetails.LastName"
                                placeholder="Last name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" [(ngModel)]="userDetails.Email" placeholder="Email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" [(ngModel)]="userDetails.Username"
                            placeholder="Username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea rows="4" class="form-control" [(ngModel)]="userDetails.Description"
                            placeholder="Tell us a little about yourself"></textarea>
                    </div>

                    <button type="button" (click)="updateUserPublicInfo(userDetails)" class="btn settings-save-btn">
                        <i class="fa-solid fa-check" aria-hidden="true"></i> Save changes
                    </button>
                </div>
            </section>

            <!-- Address information -->
            <section class="settings-card" *ngIf="activeTab === 'address'">
                <div class="settings-card__header">
                    <h3>Address information</h3>
                    <p>Where should we deliver your orders?</p>
                </div>

                <div class="settings-card__body" *ngIf="userDetails">
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" [(ngModel)]="userDetails.Address"
                            placeholder="1234 Main St">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" [(ngModel)]="userDetails.City" placeholder="City">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">State</label>
                            <input type="text" class="form-control" [(ngModel)]="userDetails.State" placeholder="State">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Zip</label>
                            <input type="text" class="form-control" [(ngModel)]="userDetails.ZipCode" placeholder="Zip">
                        </div>
                    </div>

                    <button type="button" (click)="updateUserPublicInfo(userDetails)" class="btn settings-save-btn">
                        <i class="fa-solid fa-check" aria-hidden="true"></i> Save changes
                    </button>
                </div>
            </section>

            <!-- Change password -->
            <section class="settings-card" *ngIf="activeTab === 'password'">
                <div class="settings-card__header">
                    <h3>Change password</h3>
                    <p>Choose a strong password you don't use anywhere else.</p>
                </div>

                <div class="settings-card__body">
                    <div *ngIf="passwordErrorMessage.length > 0" class="alert alert-danger" role="alert">
                        <ul class="mb-0 ps-3">
                            <li *ngFor="let error of passwordErrorMessage">{{ error }}</li>
                        </ul>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Current password</label>
                        <input type="password" class="form-control" [(ngModel)]="changePasswordViewModel.OldPassword"
                            autocomplete="current-password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New password</label>
                        <input type="password" class="form-control" [(ngModel)]="changePasswordViewModel.NewPassword"
                            autocomplete="new-password">
                        <ul class="password-hints" *ngIf="changePasswordViewModel.NewPassword">
                            <li *ngFor="let requirement of passwordRequirements"
                                [class.password-hints__met]="requirement.test(changePasswordViewModel.NewPassword || '')">
                                <i class="fa-solid"
                                    [ngClass]="requirement.test(changePasswordViewModel.NewPassword || '') ? 'fa-circle-check' : 'fa-circle'"></i>
                                <span>{{ requirement.label }}</span>
                            </li>
                        </ul>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" [(ngModel)]="repeatNewPassword"
                            autocomplete="new-password">
                    </div>

                    <button type="button" (click)="changePassword()" class="btn settings-save-btn">
                        <i class="fa-solid fa-key" aria-hidden="true"></i> Change password
                    </button>
                </div>
            </section>
        </div>
    </div>
</div>
