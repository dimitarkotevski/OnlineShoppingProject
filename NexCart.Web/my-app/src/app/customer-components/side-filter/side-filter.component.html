<aside class="side-filter" aria-label="Product filters">
  <div class="side-filter__header">
    <div>
      <span class="side-filter__eyebrow">Refine</span>
      <h2 class="side-filter__title">
        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
        Filters
      </h2>
    </div>
    <button
      *ngIf="hasActiveFilters"
      type="button"
      class="side-filter__clear"
      (click)="clearFilters()">
      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
      Clear
    </button>
  </div>

  <section class="filter-section">
    <button
      class="filter-toggle"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapsePrice"
      aria-expanded="true"
      aria-controls="collapsePrice">
      <span class="filter-toggle__label">
        <i class="fa-solid fa-dollar-sign" aria-hidden="true"></i>
        Price range
      </span>
      <i class="fa-solid fa-chevron-down filter-toggle__icon" aria-hidden="true"></i>
    </button>

    <div id="collapsePrice" class="collapse show">
      <div class="filter-section__body">
        <div class="price-fields">
          <label class="price-field">
            <span class="price-field__label">Min</span>
            <span class="price-field__control">
              <span class="price-field__currency">$</span>
              <input
                [(ngModel)]="filterProducts.PriceFrom"
                type="number"
                min="0"
                step="0.01"
                class="price-field__input"
                placeholder="0"
                aria-label="Minimum price">
            </span>
          </label>

          <span class="price-fields__separator" aria-hidden="true">&ndash;</span>

          <label class="price-field">
            <span class="price-field__label">Max</span>
            <span class="price-field__control">
              <span class="price-field__currency">$</span>
              <input
                [(ngModel)]="filterProducts.PriceTo"
                type="number"
                min="0"
                step="0.01"
                class="price-field__input"
                placeholder="Any"
                aria-label="Maximum price">
            </span>
          </label>
        </div>

        <button type="button" class="btn filter-apply" (click)="searchPrice()">
          <i class="fa-solid fa-check" aria-hidden="true"></i>
          Apply price
        </button>
      </div>
    </div>
  </section>

  <section class="filter-section">
    <button
      class="filter-toggle collapsed"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapseBrands"
      aria-expanded="false"
      aria-controls="collapseBrands">
      <span class="filter-toggle__label">
        <i class="fa-solid fa-tags" aria-hidden="true"></i>
        Brands
        <span *ngIf="filter.length" class="filter-count">{{ filter.length }}</span>
      </span>
      <i class="fa-solid fa-chevron-down filter-toggle__icon" aria-hidden="true"></i>
    </button>

    <div id="collapseBrands" class="collapse">
      <div class="filter-section__body">
        <div *ngIf="brands?.length; else noBrands" class="brand-list">
          <label
            *ngFor="let brand of brands"
            class="brand-option"
            [class.brand-option--selected]="filter.includes(brand)">
            <input
              class="brand-option__input"
              type="checkbox"
              [value]="brand"
              [checked]="filter.includes(brand)"
              (change)="onChangeBrands($event)">
            <span class="brand-option__box">
              <i class="fa-solid fa-check" aria-hidden="true"></i>
            </span>
            <span class="brand-option__name">{{ brand }}</span>
          </label>
        </div>

        <ng-template #noBrands>
          <!-- Show the empty state only once the brand request has resolved. -->
          <p *ngIf="brands" class="filter-empty">No brands available for this category.</p>
        </ng-template>
      </div>
    </div>
  </section>
</aside>
