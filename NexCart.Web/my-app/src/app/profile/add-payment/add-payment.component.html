<h2 mat-dialog-title class="payment-dialog__title">
    <i class="fa-solid fa-credit-card" aria-hidden="true"></i>
    Payment information
</h2>

<div mat-dialog-content class="payment-dialog__content">
    <div class="row g-4 align-items-start">
        <!-- Live card preview -->
        <div class="col-md-6">
            <div class="payment-preview">
                <div class="creditcard" [class.flipped]="cvcFocused">
                    <div class="front">
                        <svg version="1.1" id="cardfront" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                            x="0px" y="0px" viewBox="0 0 750 471" style="enable-background:new 0 0 750 471;" xml:space="preserve">
                            <g id="Front">
                                <g id="CardBackground">
                                    <g id="Page-1_1_">
                                        <g id="amex_1_">
                                            <path id="Rectangle-1_1_" class="lightcolor grey" d="M40,0h670c22.1,0,40,17.9,40,40v391c0,22.1-17.9,40-40,40H40c-22.1,0-40-17.9-40-40V40
                                    C0,17.9,17.9,0,40,0z" />
                                        </g>
                                    </g>
                                    <path class="darkcolor greydark" d="M750,431V193.2c-217.6-57.5-556.4-13.5-750,24.9V431c0,22.1,17.9,40,40,40h670C732.1,471,750,453.1,750,431z" />
                                </g>
                                <text transform="matrix(1 0 0 1 60.106 295.0121)" id="svgnumber" class="st2 st3 st4">{{firstFourDigit}} {{secondFourDigit}} {{thirdFourDigit}} {{fourthFourDigit}}</text>
                                <text transform="matrix(1 0 0 1 54.1064 428.1723)" id="svgname" class="st2 st5 st6">{{model.CardHolder}}</text>
                                <text transform="matrix(1 0 0 1 54.1074 389.8793)" class="st7 st5 st8">cardholder name</text>
                                <text transform="matrix(1 0 0 1 479.7754 388.8793)" class="st7 st5 st8">expiration</text>
                                <text transform="matrix(1 0 0 1 65.1054 241.5)" class="st7 st5 st8">card number</text>
                                <g>
                                    <text transform="matrix(1 0 0 1 574.4219 433.8095)" id="svgexpire" class="st2 st5 st9">{{dateString}}</text>
                                    <text transform="matrix(1 0 0 1 479.3848 417.0097)" class="st2 st10 st11">VALID</text>
                                    <text transform="matrix(1 0 0 1 479.3848 435.6762)" class="st2 st10 st11">THRU</text>
                                    <polygon class="st2" points="554.5,421 540.4,414.2 540.4,427.9 		" />
                                </g>
                                <g id="cchip">
                                    <g>
                                        <path class="st2" d="M168.1,143.6H82.9c-10.2,0-18.5-8.3-18.5-18.5V74.9c0-10.2,8.3-18.5,18.5-18.5h85.3
                                c10.2,0,18.5,8.3,18.5,18.5v50.2C186.6,135.3,178.3,143.6,168.1,143.6z" />
                                    </g>
                                    <g>
                                        <g>
                                            <rect x="82" y="70" class="st12" width="1.5" height="60" />
                                        </g>
                                        <g>
                                            <rect x="167.4" y="70" class="st12" width="1.5" height="60" />
                                        </g>
                                        <g>
                                            <path class="st12" d="M125.5,130.8c-10.2,0-18.5-8.3-18.5-18.5c0-4.6,1.7-8.9,4.7-12.3c-3-3.4-4.7-7.7-4.7-12.3
                                    c0-10.2,8.3-18.5,18.5-18.5s18.5,8.3,18.5,18.5c0,4.6-1.7,8.9-4.7,12.3c3,3.4,4.7,7.7,4.7,12.3
                                    C143.9,122.5,135.7,130.8,125.5,130.8z M125.5,70.8c-9.3,0-16.9,7.6-16.9,16.9c0,4.4,1.7,8.6,4.8,11.8l0.5,0.5l-0.5,0.5
                                    c-3.1,3.2-4.8,7.4-4.8,11.8c0,9.3,7.6,16.9,16.9,16.9s16.9-7.6,16.9-16.9c0-4.4-1.7-8.6-4.8-11.8l-0.5-0.5l0.5-0.5
                                    c3.1-3.2,4.8-7.4,4.8-11.8C142.4,78.4,134.8,70.8,125.5,70.8z" />
                                        </g>
                                        <g>
                                            <rect x="82.8" y="82.1" class="st12" width="25.8" height="1.5" />
                                        </g>
                                        <g>
                                            <rect x="82.8" y="117.9" class="st12" width="26.1" height="1.5" />
                                        </g>
                                        <g>
                                            <rect x="142.4" y="82.1" class="st12" width="25.8" height="1.5" />
                                        </g>
                                        <g>
                                            <rect x="142" y="117.9" class="st12" width="26.2" height="1.5" />
                                        </g>
                                    </g>
                                </g>
                            </g>
                        </svg>
                    </div>

                    <!-- Back of the card, revealed while entering the CVC -->
                    <div class="back">
                        <svg version="1.1" id="cardback" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                            x="0px" y="0px" viewBox="0 0 750 471" style="enable-background:new 0 0 750 471;" xml:space="preserve">
                            <g id="Back">
                                <g id="CardBackgroundBack">
                                    <path class="lightcolor grey" d="M40,0h670c22.1,0,40,17.9,40,40v391c0,22.1-17.9,40-40,40H40c-22.1,0-40-17.9-40-40V40
                                        C0,17.9,17.9,0,40,0z" />
                                </g>
                                <rect class="magstripe" x="0" y="76" width="750" height="104" />
                                <rect class="signature-panel" x="40" y="300" width="670" height="82" rx="6" />
                                <text transform="matrix(1 0 0 1 62 352)" class="cvclabel">CVC</text>
                                <text transform="matrix(1 0 0 1 590 354)" class="cvcvalue">{{model.SecurityCode}}</text>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="col-md-6">
            <div class="payment-field">
                <label for="cardHolder">Card holder</label>
                <input id="cardHolder" name="card_holder" type="text" class="form-control" placeholder="Jane Doe"
                    autocomplete="cc-name" [(ngModel)]="model.CardHolder"
                    (blur)="cardHolderTouched = true"
                    [class.is-invalid]="showCardHolderError">
                <p class="payment-field__error" *ngIf="showCardHolderError">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                    Card holder name is required.
                </p>
            </div>

            <div class="payment-field">
                <label>Card number</label>
                <div class="row g-2">
                    <div class="col-3">
                        <input name="card_number_1" type="text" class="form-control" placeholder="1111" maxlength="4"
                            inputmode="numeric" autocomplete="cc-number" [(ngModel)]="firstFourDigit"
                            (blur)="cardNumberTouched = true"
                            [class.is-invalid]="showCardNumberError">
                    </div>
                    <div class="col-3">
                        <input name="card_number_2" type="text" class="form-control" placeholder="1111" maxlength="4"
                            inputmode="numeric" [(ngModel)]="secondFourDigit"
                            (blur)="cardNumberTouched = true"
                            [class.is-invalid]="showCardNumberError">
                    </div>
                    <div class="col-3">
                        <input name="card_number_3" type="text" class="form-control" placeholder="1111" maxlength="4"
                            inputmode="numeric" [(ngModel)]="thirdFourDigit"
                            (blur)="cardNumberTouched = true"
                            [class.is-invalid]="showCardNumberError">
                    </div>
                    <div class="col-3">
                        <input name="card_number_4" type="text" class="form-control" placeholder="1111" maxlength="4"
                            inputmode="numeric" [(ngModel)]="fourthFourDigit"
                            (blur)="cardNumberTouched = true"
                            [class.is-invalid]="showCardNumberError">
                    </div>
                </div>
                <p class="payment-field__error" *ngIf="showCardNumberError">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                    Card number must be 16 digits (four groups of four).
                </p>
            </div>

            <div class="row g-2">
                <div class="col-7">
                    <div class="payment-field" (click)="$event.stopPropagation()">
                        <label for="expireMonth">Expiry date</label>

                        <div class="expiry-input"
                            [class.expiry-input--open]="expiryPickerOpen"
                            [class.expiry-input--invalid]="showExpiryError || showExpiryExpiredError">
                            <input id="expireMonth" name="expire_month" type="text" class="expiry-input__part"
                                placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="cc-exp-month"
                                aria-label="Expiry month" [ngModel]="expireMonth"
                                (ngModelChange)="onExpireMonthChange($event)" (blur)="onExpireBlur()"
                                (keydown.escape)="expiryPickerOpen = false">
                            <span class="expiry-input__sep" aria-hidden="true">/</span>
                            <input id="expireYear" name="expire_year" type="text" class="expiry-input__part"
                                placeholder="YY" maxlength="2" inputmode="numeric" autocomplete="cc-exp-year"
                                aria-label="Expiry year" [ngModel]="expireYear"
                                (ngModelChange)="onExpireYearChange($event)" (blur)="onExpireBlur()"
                                (keydown.escape)="expiryPickerOpen = false">
                            <button type="button" class="expiry-input__toggle" (click)="toggleExpiryPicker($event)"
                                [attr.aria-expanded]="expiryPickerOpen"
                                aria-label="Pick expiry date from calendar">
                                <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                            </button>
                        </div>

                        <p class="payment-field__error" *ngIf="showExpiryError">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            Enter a valid expiry date (MM / YY).
                        </p>
                        <p class="payment-field__error" *ngIf="showExpiryExpiredError">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            This card has already expired.
                        </p>

                        <div class="expiry-picker" *ngIf="expiryPickerOpen">
                            <div class="expiry-picker__header">
                                <button type="button" class="expiry-picker__nav" (click)="shiftExpiryYear(-1)"
                                    aria-label="Previous year">
                                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                                </button>
                                <span class="expiry-picker__year">{{ expiryViewYear }}</span>
                                <button type="button" class="expiry-picker__nav" (click)="shiftExpiryYear(1)"
                                    aria-label="Next year">
                                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="expiry-picker__months">
                                <button type="button" class="expiry-picker__month"
                                    [class.expiry-picker__month--selected]="isExpiryMonthSelected(i)"
                                    *ngFor="let label of monthLabels; let i = index"
                                    (click)="selectExpiryMonth(i)">{{ label }}</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-5">
                    <div class="payment-field">
                        <label for="securityCode">CVC</label>
                        <input id="securityCode" name="security_code" type="text" class="form-control" placeholder="123"
                            maxlength="4" inputmode="numeric" autocomplete="cc-csc" [(ngModel)]="model.SecurityCode"
                            (focus)="cvcFocused = true" (blur)="cvcFocused = false; securityCodeTouched = true"
                            [class.is-invalid]="showSecurityCodeError">
                        <p class="payment-field__error" *ngIf="showSecurityCodeError">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            Security code must be 3 or 4 digits.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div mat-dialog-actions class="payment-dialog__actions">
    <button type="button" class="btn payment-dialog__btn payment-dialog__btn--ghost" [mat-dialog-close]="false">
        Cancel
    </button>
    <button type="button" class="btn payment-dialog__btn payment-dialog__btn--primary" (click)="save()">
        <i class="fa-solid fa-check" aria-hidden="true"></i> Save card
    </button>
</div>
