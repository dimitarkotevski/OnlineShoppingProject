<div class="container">

  <app-breadcrumb [isItem]="false" [itemDetail]="'Favourite Products'"></app-breadcrumb>

  <div *ngIf="responseModel?.TotalItems" class="py-3">
    <app-products-grid 
        [hasRemoveProductButton]="true" 
        [type]="'favourite'"
        (refreshState)="refreshState()"
        [products]="responseModel?.Items"></app-products-grid>
  </div>

  <div *ngIf="!isLoading && responseModel?.TotalItems === 0">
    <app-no-data
      title="List of favourite products is empty!"
      message="You haven't added any products to your favourites yet."
      icon="fa-regular fa-heart"
      buttonText="Keep buying"
      buttonRoute="/"
    ></app-no-data>
  </div>

  <app-loading-grid *ngIf="isLoading"></app-loading-grid>
</div>
