<div class="side-filter-container">
  <div class="accordion" id="productFilterAccordion">

    <!-- Price Filter -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingPrice">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePrice" aria-expanded="false" aria-controls="collapsePrice">
          Price Range
        </button>
      </h2>
      <div id="collapsePrice" class="accordion-collapse collapse" aria-labelledby="headingPrice" data-bs-parent="#productFilterAccordion">
        <div class="accordion-body">
          <div class="row g-2">
            <div class="col-5">
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input [(ngModel)]="filterProducts.PriceFrom" type="number" class="form-control" placeholder="From">
              </div>
            </div>
            <div class="col-2 text-center align-self-center">-</div>
            <div class="col-5">
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input [(ngModel)]="filterProducts.PriceTo" type="number" class="form-control" placeholder="To">
              </div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-coral w-100" (click)="searchPrice()">Apply Price</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Brands Filter -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingBrands">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBrands" aria-expanded="false" aria-controls="collapseBrands">
          Brands
        </button>
      </h2>
      <div id="collapseBrands" class="accordion-collapse collapse" aria-labelledby="headingBrands" data-bs-parent="#productFilterAccordion">
        <div class="accordion-body">
          <div class="brand-list">
            <div *ngFor="let brand of brands" class="form-check mb-2">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'brand-' + brand"
                [value]="brand"
                (change)="onChangeBrands($event)"
              >
              <label class="form-check-label" [for]="'brand-' + brand">
                {{ brand }}
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
