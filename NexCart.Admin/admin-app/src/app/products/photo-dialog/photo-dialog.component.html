<h2 mat-dialog-title>
  <i class="fa-solid fa-image me-2 text-coral"></i> Product photo
</h2>

<mat-dialog-content>
  <div class="photo-dialog__preview">
    <img
      *ngIf="photoUrl"
      [src]="photoUrl | byPassSecurity"
      alt="Product photo"
      class="photo-dialog__img"
    />
    <div *ngIf="!photoUrl" class="photo-dialog__placeholder">
      <i class="fa-solid fa-image"></i>
      <p>No photo available</p>
    </div>
  </div>

  <div class="photo-dialog__upload">
    <label for="myfile" class="photo-dialog__label">
      <i class="fa-solid fa-upload me-1"></i> Choose new photo
    </label>
    <input
      type="file"
      id="myfile"
      name="myfile"
      (change)="onFileSelected($event)"
      accept="image/*"
    />
    <span class="photo-dialog__file" *ngIf="selectedFileName" [title]="selectedFileName">
      {{ selectedFileName }}
    </span>
  </div>
  <p class="photo-dialog__hint">JPG, PNG, GIF or WebP, up to 5 MB.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null" class="btn-cancel">
    <i class="fa-solid fa-xmark me-1"></i> Close
  </button>
  <button
    *ngIf="addPhotoButton"
    mat-flat-button
    color="primary"
    (click)="addPhoto(photoUrl)"
    [disabled]="saving"
    class="btn-save"
  >
    <span *ngIf="saving" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    <i *ngIf="!saving" class="fa-solid fa-check me-1"></i>
    {{ saving ? 'Saving…' : 'Save photo' }}
  </button>
</mat-dialog-actions>
