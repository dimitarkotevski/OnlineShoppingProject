<h2 mat-dialog-title>
  <i class="fa-solid me-2 text-coral" [ngClass]="model.Id ? 'fa-pen' : 'fa-plus'"></i>
  {{ title }} product
</h2>

<mat-dialog-content>
  <form #productForm="ngForm" class="product-form">
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Product name</mat-label>
      <input matInput [(ngModel)]="model.Name" name="name" placeholder="Enter product name" required />
      <mat-error *ngIf="productForm.controls['name']?.invalid && productForm.controls['name']?.touched">
        Product name is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Price</mat-label>
      <input matInput [(ngModel)]="model.Price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
      <span matTextPrefix>$&nbsp;</span>
      <mat-error *ngIf="productForm.controls['price']?.invalid && productForm.controls['price']?.touched">
        Valid price is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="model.Description" name="description" rows="4" placeholder="Describe the product..."></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Category</mat-label>
      <mat-select [(ngModel)]="selectedCategoryId" name="category">
        <mat-option *ngFor="let item of categories" [value]="item.Id">
          {{ item.Name }}
        </mat-option>
      </mat-select>
      <mat-hint *ngIf="!categories?.length">No categories available.</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null" class="btn-cancel">
    <i class="fa-solid fa-xmark me-1"></i> Cancel
  </button>
  <button
    mat-flat-button
    color="primary"
    [mat-dialog-close]="model"
    [disabled]="productForm.invalid"
    class="btn-save"
  >
    <i class="fa-solid fa-check me-1"></i> Save
  </button>
</mat-dialog-actions>
