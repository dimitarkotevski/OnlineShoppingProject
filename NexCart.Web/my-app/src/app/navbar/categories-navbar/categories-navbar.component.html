<nav *ngIf="categoryNavBar && (isCategoriesLoading || categories)" class="cat-nav-wrapper navbar solid-hide-on-sm navbar-expand-md navbar-expand-lg p-0">
  <div class="container container-sm">
    <!-- Skeleton pills shown while the categories are being fetched -->
    <div *ngIf="isCategoriesLoading" class="cat-skeleton">
      <app-skeleton [row]="true" shape="pill" [count]="6" width="5.5rem" gap="8px"></app-skeleton>
    </div>

    <ul #catList class="navbar-nav w-100" *ngIf="!isCategoriesLoading">
      <li class="nav-item"
        *ngFor="let category of categories | slice:0:visibleCount"
        [class.active-pill]="isLinkActive(category.Id)">
        <a class="nav-link solid-gray-text" [routerLink]="['/category',category.Id]">{{ category.Name }}</a>
      </li>

      <li class="nav-item" ngbDropdown *ngIf="overflowCategories.length > 0" placement="bottom-end">
        <a class="nav-link solid-gray-text dropdown-toggle" ngbDropdownToggle role="button" aria-expanded="false">More</a>
        <ul class="dropdown-menu" ngbDropdownMenu>
          <li *ngFor="let category of overflowCategories">
            <a class="dropdown-item" ngbDropdownItem [routerLink]="['/category',category.Id]">{{ category.Name }}</a>
          </li>
        </ul>
      </li>
    </ul>
  </div>

  <!-- Hidden, off-screen copies used only to measure real layout widths -->
  <ul #measureList class="navbar-nav cat-measure" aria-hidden="true">
    <li class="nav-item" *ngFor="let category of categories">
      <a class="nav-link solid-gray-text">{{ category.Name }}</a>
    </li>
  </ul>
  <ul class="navbar-nav cat-measure" aria-hidden="true">
    <li class="nav-item dropdown" #measureMore>
      <a class="nav-link solid-gray-text dropdown-toggle">More</a>
    </li>
  </ul>
</nav>

<nav *ngIf="!categoryNavBar" class="admin-nav-wrapper navbar solid-hide-on-sm navbar-expand-md navbar-expand-lg p-0">
  <div class="container container-sm">
    <ul class="admin-submenu">
      <li class="admin-item">
        <a class="admin-link" [routerLink]="['/admin-tool/products']">Products</a>
      </li>
      <li class="admin-item">
          <a class="admin-link" [routerLink]="['/admin-tool/orders']">Orders</a>
      </li>
      <li class="admin-item">
          <a class="admin-link" [routerLink]="['/admin-tool/users']">Users</a>
      </li>
    </ul>
  </div>
</nav>
