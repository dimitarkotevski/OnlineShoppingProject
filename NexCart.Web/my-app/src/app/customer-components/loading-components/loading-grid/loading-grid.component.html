<div
  *ngIf="isGridLoading"
  class="product-skeleton-grid"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <span class="skeleton-sr-only">Loading products from the server…</span>

  <article
    *ngFor="let placeholder of productPlaceholders"
    class="product-skeleton-card"
    aria-hidden="true"
  >
    <app-skeleton shape="block" height="180px"></app-skeleton>
    <app-skeleton width="34%" height="0.7rem"></app-skeleton>
    <app-skeleton width="92%" height="1rem"></app-skeleton>
    <app-skeleton width="58%" height="1rem"></app-skeleton>

    <div class="product-skeleton-card__footer">
      <app-skeleton width="45%" height="1.2rem"></app-skeleton>
      <app-skeleton height="2.4rem"></app-skeleton>
    </div>
  </article>
</div>

<div
  *ngIf="!isGridLoading"
  class="list-skeleton"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <span class="skeleton-sr-only">Loading items from the server…</span>

  <div
    *ngFor="let placeholder of listPlaceholders"
    class="list-skeleton__row"
    aria-hidden="true"
  >
    <app-skeleton shape="block" width="64px" height="64px"></app-skeleton>

    <div class="list-skeleton__body">
      <app-skeleton width="45%" height="1rem"></app-skeleton>
      <app-skeleton width="72%" height="0.8rem"></app-skeleton>
    </div>

    <app-skeleton width="72px" height="1rem"></app-skeleton>
    <app-skeleton width="42px" height="1rem"></app-skeleton>
  </div>
</div>
