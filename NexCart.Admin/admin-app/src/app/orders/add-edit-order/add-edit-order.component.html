<h2 mat-dialog-title>
  <i class="fa-solid fa-receipt me-2 text-coral"></i>
  {{ title }} order
</h2>

<mat-dialog-content *ngIf="model">
  <form class="order-form">
    <div class="row g-3 mb-3">
      <div class="col-6">
        <label for="order_name" class="form-label">Order name</label>
        <input id="order_name" name="order_name" [(ngModel)]="model.OrderName" disabled type="text" class="form-control" />
      </div>
      <div class="col-6">
        <label for="user_name" class="form-label">Customer</label>
        <input id="user_name" name="user_name" [ngModel]="model.User?.Name" disabled type="text" class="form-control" />
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6">
        <label for="cart_name" class="form-label">Shopping cart</label>
        <input id="cart_name" name="cart_name" [ngModel]="model.ShoppingCart?.Name" disabled type="text" class="form-control" />
      </div>
      <div class="col-6">
        <span class="form-label d-block">Payment</span>
        <span class="pill" [ngClass]="model.PaymentType == 1 ? 'pill--dark' : ''">
          <i class="fa-solid" [ngClass]="model.PaymentType == 1 ? 'fa-credit-card' : 'fa-money-bill'"></i>
          {{ model.PaymentType | paymentType }}
        </span>
      </div>
    </div>

    <div class="col-6">
      <label for="order_status" class="form-label">Order status</label>
      <select
        id="order_status"
        name="order_status"
        class="form-select"
        [(ngModel)]="model.OrderStatus"
        [disabled]="isCompleted"
      >
        <option [ngValue]="0">Canceled</option>
        <option [ngValue]="1">On Hold</option>
        <option [ngValue]="2">Pending Payment</option>
        <option [ngValue]="3">Completed</option>
      </select>
      <div *ngIf="isCompleted" class="form-text">Completed orders can no longer change status.</div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null" class="btn-cancel">
    <i class="fa-solid fa-xmark me-1"></i> Cancel
  </button>
  <button mat-flat-button color="primary" [mat-dialog-close]="model" class="btn-save">
    <i class="fa-solid fa-check me-1"></i> Save
  </button>
</mat-dialog-actions>
